<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phrase Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      margin-top: 8px;
      color: #666;
      font-size: 0.9rem;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .card.bump {
      border-color: #7c3aed !important;
      box-shadow: none !important;
      animation: pulse 0.4s ease-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .card .count {
      font-size: 4rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1;
      margin-bottom: 12px;
    }

    .card .name {
      font-size: 1rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
    }

    .card .phrase-text {
      font-size: 0.78rem;
      color: #9ca3af;
      font-style: italic;
      margin-bottom: 12px;
    }

    .card .last-seen {
      font-size: 0.75rem;
      color: #868c98;
    }

    #status {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #444;
    }

    #status span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .loading {
      color: #444;
      margin-top: 60px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Phrase Counter</h1>
    <p>Live — updates automatically</p>
  </header>

  <div id="grid"><p class="loading">Loading...</p></div>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Fill these in with your Supabase project URL and anon key ──────────────
    const SUPABASE_URL = 'https://olwznqxrqccxntxbofys.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_skOFyHPnaeXzwFt6pslPQQ_8Y5y7lMo';
    // ──────────────────────────────────────────────────────────────────────────

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');

    // All tiles are the same red hue. Saturation is rank-based, not magnitude-
    // based: sort phrases by count ascending, and each phrase's saturation is
    // its rank * (100 / number of phrases tracked) — so with 10 phrases the
    // steps are 0, 10, 20, ... 90; with 5 phrases, 0, 20, 40, 60, 80. The
    // lowest-count phrase always lands at 0% (pure gray, no red at all); the
    // highest-count phrase gets the last step below 100%. Ties (equal counts)
    // break on id for a stable, non-flickering rank.
    const HEAT_HUE = 358;
    const HEAT_LIGHTNESS = 45;

    function applyHeatColors() {
      const cards = Array.from(grid.querySelectorAll('.card'));
      const step = cards.length > 0 ? 100 / cards.length : 0;

      const ranked = [...cards].sort((a, b) => {
        const diff = Number(a.dataset.count) - Number(b.dataset.count);
        return diff !== 0 ? diff : a.id.localeCompare(b.id);
      });

      ranked.forEach((card, rank) => {
        const saturation = Math.round(rank * step);
        const color = `hsl(${HEAT_HUE} ${saturation}% ${HEAT_LIGHTNESS}%)`;
        const glowColor = `hsl(${HEAT_HUE} ${saturation}% ${HEAT_LIGHTNESS}% / 0.4)`;
        card.style.borderColor = color;
        card.style.boxShadow = saturation > 0 ? `0 0 ${Math.round((saturation / 100) * 24)}px ${glowColor}` : 'none';
        // Translucent tint over the card's dark base, not an opaque fill —
        // keeps white text readable at every saturation level.
        card.style.backgroundColor = `color-mix(in srgb, ${color} ${Math.round((saturation / 100) * 22)}%, #1a1a1a)`;
      });
    }

    function timeAgo(isoString) {
      if (!isoString) return 'never';
      const diff = Math.floor((Date.now() - new Date(isoString)) / 1000);
      if (diff < 60)   return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      return `${Math.floor(diff / 3600)}h ago`;
    }

    function cardId(id) { return `card-${id}`; }

    function renderCard(p) {
      return `
        <div class="card" id="${cardId(p.id)}" data-count="${p.count}">
          <div class="count">${p.count}</div>
          <div class="name">${p.name}</div>
          <div class="phrase-text">"${p.phrase}"</div>
          <div class="last-seen">Last: ${timeAgo(p.last_detected)}</div>
        </div>`;
    }

    function sortGrid() {
      const cards = Array.from(grid.querySelectorAll('.card'));
      cards.sort((a, b) => Number(b.dataset.count) - Number(a.dataset.count));
      cards.forEach(card => grid.appendChild(card));
    }

    function bumpCard(id, newData) {
      const el = document.getElementById(cardId(id));
      if (!el) return;
      el.dataset.count = newData.count;
      el.querySelector('.count').textContent = newData.count;
      el.querySelector('.last-seen').textContent = `Last: ${timeAgo(newData.last_detected)}`;
      el.classList.remove('bump');
      void el.offsetWidth; // force reflow to restart animation
      el.classList.add('bump');
      el.addEventListener('animationend', () => el.classList.remove('bump'), { once: true });
      sortGrid();
      applyHeatColors();
    }

    async function init() {
      const { data, error } = await client.from('phrases').select('*').order('count', { ascending: false });
      if (error) {
        grid.innerHTML = `<p style="color:#f87171">Error: ${error.message}</p>`;
        return;
      }

      grid.innerHTML = data.map(renderCard).join('');
      applyHeatColors();

      // Keep last-seen timestamps fresh every 30s
      setInterval(() => {
        document.querySelectorAll('.card').forEach(card => {
          const lastSeen = card.querySelector('.last-seen');
          // We'd need the timestamp stored — simpler to just refresh
        });
      }, 30000);

      // Real-time subscription
      client.channel('phrase-updates')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'phrases' },
          payload => bumpCard(payload.new.id, payload.new))
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            statusEl.innerHTML = '<span></span>Live';
          }
        });
    }

    init();
  </script>
</body>
</html>
