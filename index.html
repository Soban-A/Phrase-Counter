<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phrase Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
    }

    header p {
      margin-top: 8px;
      color: #666;
      font-size: 0.9rem;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 32px 24px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .card.bump {
      border-color: #7c3aed;
      animation: pulse 0.4s ease-out;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    .card .count {
      font-size: 4rem;
      font-weight: 900;
      color: #a78bfa;
      line-height: 1;
      margin-bottom: 12px;
    }

    .card .name {
      font-size: 1rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 8px;
    }

    .card .phrase-text {
      font-size: 0.78rem;
      color: #555;
      font-style: italic;
      margin-bottom: 12px;
    }

    .card .last-seen {
      font-size: 0.75rem;
      color: #444;
    }

    #status {
      margin-top: 40px;
      font-size: 0.8rem;
      color: #444;
    }

    #status span {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 6px;
      animation: blink 2s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .loading {
      color: #444;
      margin-top: 60px;
      font-size: 0.9rem;
    }

    #transcript {
      width: 100%;
      max-width: 900px;
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 32px;
      min-height: 1.4em;
      font-size: 0.95rem;
      color: #9ca3af;
      font-style: italic;
      white-space: pre-line;
    }

    #transcript .label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #555;
      font-style: normal;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Phrase Counter</h1>
    <p>Live — updates automatically</p>
  </header>

  <div id="transcript"><span class="label">Live transcript</span><span id="transcript-text">Waiting for audio...</span></div>
  <div id="grid"><p class="loading">Loading...</p></div>
  <div id="status"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ── Fill these in with your Supabase project URL and anon key ──────────────
    const SUPABASE_URL = 'https://olwznqxrqccxntxbofys.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_skOFyHPnaeXzwFt6pslPQQ_8Y5y7lMo';
    // ──────────────────────────────────────────────────────────────────────────

    const { createClient } = supabase;
    const client = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const grid = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const transcriptTextEl = document.getElementById('transcript-text');

    function renderTranscript(text) {
      transcriptTextEl.textContent = text || 'Waiting for audio...';
    }

    function timeAgo(isoString) {
      if (!isoString) return 'never';
      const diff = Math.floor((Date.now() - new Date(isoString)) / 1000);
      if (diff < 60)   return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      return `${Math.floor(diff / 3600)}h ago`;
    }

    function cardId(id) { return `card-${id}`; }

    function renderCard(p) {
      return `
        <div class="card" id="${cardId(p.id)}">
          <div class="count">${p.count}</div>
          <div class="name">${p.name}</div>
          <div class="phrase-text">"${p.phrase}"</div>
          <div class="last-seen">Last: ${timeAgo(p.last_detected)}</div>
        </div>`;
    }

    function bumpCard(id, newData) {
      const el = document.getElementById(cardId(id));
      if (!el) return;
      el.querySelector('.count').textContent = newData.count;
      el.querySelector('.last-seen').textContent = `Last: ${timeAgo(newData.last_detected)}`;
      el.classList.remove('bump');
      void el.offsetWidth; // force reflow to restart animation
      el.classList.add('bump');
    }

    async function init() {
      const { data, error } = await client.from('phrases').select('*').order('name');
      if (error) {
        grid.innerHTML = `<p style="color:#f87171">Error: ${error.message}</p>`;
        return;
      }

      grid.innerHTML = data.map(renderCard).join('');

      const { data: transcriptRow } = await client
        .from('live_transcript').select('text').eq('id', 'current').single();
      if (transcriptRow) renderTranscript(transcriptRow.text);

      // Keep last-seen timestamps fresh every 30s
      setInterval(() => {
        document.querySelectorAll('.card').forEach(card => {
          const lastSeen = card.querySelector('.last-seen');
          // We'd need the timestamp stored — simpler to just refresh
        });
      }, 30000);

      // Real-time subscription
      client.channel('phrase-updates')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'phrases' },
          payload => bumpCard(payload.new.id, payload.new))
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'live_transcript' },
          payload => renderTranscript(payload.new.text))
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            statusEl.innerHTML = '<span></span>Live';
          }
        });
    }

    init();
  </script>
</body>
</html>
